#kafka
mp.messaging.outgoing.general.enabled=true
mp.messaging.outgoing.general.connector=smallrye-kafka

#in-memory schema registry, so no running registry is needed
mp.messaging.connector.smallrye-kafka.schema.registry.url=mock://person-service
mp.messaging.outgoing.general.auto.register.schemas=true
mp.messaging.outgoing.general.use.latest.version=false

mp.messaging.incoming.person.topic=person
mp.messaging.incoming.person.group.id=person
mp.messaging.incoming.person.connector=smallrye-kafka
mp.messaging.incoming.person.value.deserializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
mp.messaging.incoming.person.json.value.type=org.goafabric.personservice.controller.dto.Person
mp.messaging.incoming.person.failure-strategy=dead-letter-queue
mp.messaging.incoming.person.dead-letter-queue.topic=person.person.dlt

mp.messaging.incoming.address.topic=address
mp.messaging.incoming.address.group.id=address
mp.messaging.incoming.address.connector=smallrye-kafka
mp.messaging.incoming.address.value.deserializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
mp.messaging.incoming.address.json.value.type=org.goafabric.personservice.controller.dto.Address
mp.messaging.incoming.address.failure-strategy=dead-letter-queue
mp.messaging.incoming.address.dead-letter-queue.topic=address.person.dlt

#azure
quarkus.azure.storage.blob.enabled=false